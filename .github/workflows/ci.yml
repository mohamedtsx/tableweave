name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  STORYBOOK_DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Retain failed synthetic composition evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: wp08-composition-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/controls/filter-composition/.artifacts/fc01/ordered-*/composition-results/**/trace.zip
            tests/controls/filter-composition/.artifacts/fc01/ordered-*/composition-results/**/error-context.md
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
